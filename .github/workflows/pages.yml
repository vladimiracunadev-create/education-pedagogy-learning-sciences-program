name: Pages

on:
  push:
    branches: ["main"]
    paths:
      - "curriculum/**"
      - "docs/**"
      - "manifests/**"
      - "cases/**"
      - "projects/**"
      - "assessments/**"
      - "templates/**"
      - "labs/**"
      - "*.md"
      - "catalog.json"
      - "scripts/generar_sitio.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Los permisos se declaran por job: el que construye solo lee, y solo el que
# publica recibe permiso sobre Pages.
permissions: {}

# Una sola publicación a la vez; los pushes seguidos cancelan el anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Generar sitio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generar el sitio HTML
        run: python scripts/generar_sitio.py

      - name: Generar el paquete de capacitación y publicarlo como descarga
        run: |
          python scripts/exportar_capacitacion.py
          mkdir -p site/descargas
          cp -r capacitacion site/descargas/capacitacion
          cp catalog.json site/descargas/catalog.json

      # Pages queda habilitado en la configuración del repositorio con origen
      # «GitHub Actions»; el job de construcción no necesita permiso sobre Pages.
      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
