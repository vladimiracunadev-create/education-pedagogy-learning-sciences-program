name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  # Permite relanzar la validación a mano: si GitHub no crea el run de un push,
  # sin esto la única forma de reejecutar el CI sería empujar un commit vacío.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  curriculo:
    name: Currículo, estructura y enlaces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sincronía manifiestos → currículo publicado
        run: python scripts/generar_clases.py --check

      # Offline a propósito: el registro se comprueba contra los manifiestos, no
      # contra la red. Resolver ISBN y DOI es tarea de scripts/refrescar_fuentes.py,
      # que se ejecuta a mano y no bloquea.
      - name: Registro de fuentes con localizador
        run: python scripts/verificar_fuentes.py --check

      - name: Documentos generados al día
        run: python scripts/generar_indice.py --check

      - name: Banco de actividades al día
        run: python scripts/generar_actividades.py --check

      - name: Estructura, secciones obligatorias y enlaces internos
        run: python scripts/validar_estructura.py --resumen

      - name: Codificación UTF-8 sin BOM ni mojibake
        run: python scripts/validar_encoding.py

      - name: Pruebas estructurales
        run: python -m unittest discover -s tests -v

      - name: Resumen
        if: always() && matrix.python-version == '3.12'
        run: |
          {
            echo "### Programa de Pedagogía, Docencia y Ciencias del Aprendizaje"
            echo ""
            echo "- Partes: **$(find curriculum -mindepth 1 -maxdepth 1 -type d -name 'part-*' | wc -l)**"
            echo "- Clases: **$(find curriculum -mindepth 3 -name README.md | wc -l)**"
            echo "- Palabras del currículo: **$(find curriculum -mindepth 3 -name README.md -exec cat {} + | wc -w)**"
            echo "- Documentos transversales: **$(find docs -maxdepth 1 -name '*.md' | wc -l)**"
            echo "- Diagramas mermaid: **$(grep -rc '```mermaid' curriculum --include=README.md | awk -F: '{s+=$2} END {print s}')**"
          } >> "$GITHUB_STEP_SUMMARY"

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Versión fijada a propósito: sin pin, npx instala la última y una release
      # con reglas nuevas deja el CI en rojo sin que nadie toque el repositorio.
      - name: Lint Markdown (markdownlint-cli2)
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md"

  sitio:
    name: Build del sitio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # El generador verifica sus propios enlaces internos y falla si alguno rompe.
      - name: Generar el sitio estático
        run: python scripts/generar_sitio.py

      - name: Verificar que el sitio quedó completo
        run: |
          paginas=$(find site -name '*.html' | wc -l)
          echo "Páginas generadas: $paginas"
          test "$paginas" -ge 250
          test -f site/index.html
          test -f site/assets/estilos.css
          test -f site/assets/indice.js
          test -f site/assets/diagramas.js
          test -f site/.nojekyll

      # Los diagramas se comprueban aquí y no en el job de currículo porque es
      # el HTML emitido, no el Markdown, el que debe llevar el bloque mermaid.
      - name: Verificar que las rutas por rol se publicaron
        run: |
          guias=$(find site/rutas -name '*.html' | wc -l)
          echo "Guías de rol publicadas: $guias"
          test "$guias" -ge 15
          test -f site/rutas/index.html

      - name: Verificar que los diagramas llegaron al HTML
        run: |
          con_diagrama=$(grep -rl 'class="mermaid"' site --include='*.html' | wc -l)
          echo "Páginas con diagrama: $con_diagrama"
          test "$con_diagrama" -ge 234

  capacitacion:
    name: Paquete de capacitación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Exportar el paquete
        run: python scripts/exportar_capacitacion.py

      # Un build en verde no prueba que el paquete tenga contenido: se cuenta lo
      # que quedó dentro y se comprueba que las lecciones no estén vacías.
      - name: Verificar el contenido del paquete
        run: |
          test -f capacitacion/manifiesto.json
          test -f capacitacion/programa.csv
          # Las cifras se derivan de catalog.json: el paquete debe contener el
          # currículo completo, sea cual sea su tamaño en esta versión.
          python - <<'PY'
          import json, pathlib
          catalogo = json.loads(pathlib.Path("catalog.json").read_text(encoding="utf-8"))
          clases, partes = catalogo["clases"], catalogo["partes"]
          contenido = list(pathlib.Path("capacitacion/contenido").glob("clase-*.html"))
          paginas = list(pathlib.Path("capacitacion/paginas").glob("clase-*.html"))
          print(f"Lecciones: {len(contenido)} · Páginas: {len(paginas)} · Esperado: {clases}")
          assert len(contenido) == clases, len(contenido)
          assert len(paginas) == clases, len(paginas)
          manifiesto = json.loads(pathlib.Path("capacitacion/manifiesto.json").read_text(encoding="utf-8"))
          assert len(manifiesto["modulos"]) == partes, manifiesto["modulos"]
          assert sum(len(m["lecciones"]) for m in manifiesto["modulos"]) == clases
          vacias = [p.name for p in contenido if len(p.read_text(encoding="utf-8")) < 2000]
          assert not vacias, f"lecciones con contenido insuficiente: {vacias[:5]}"
          print(f"OK: {partes} modulos, {clases} lecciones, ninguna vacia.")
          PY
