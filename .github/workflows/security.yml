name: Seguridad

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    # Revisión semanal: los hallazgos de secretos y de workflows no dependen de que
    # alguien empuje código, y este repositorio cambia por temporadas.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Los permisos se declaran por job: ninguno necesita más que lectura.
permissions: {}

concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    name: Búsqueda de secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflows:
    name: Auditoría de workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Versión fijada a propósito: sin pin, una release con auditorías nuevas
      # deja el CI en rojo sin que nadie haya tocado el repositorio.
      - name: zizmor
        run: |
          python -m pip install --upgrade pip
          pip install "zizmor==1.29.0"
          zizmor --persona regular .github/workflows/

  datos-personales:
    name: Sin datos personales ni archivos privados
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Este repositorio se compromete a no contener datos reales de estudiantes.
      # La comprobación es simple a propósito: detecta los descuidos habituales.
      - name: Comprobar que no entraron archivos excluidos
        run: |
          encontrados=$(git ls-files | grep -E '^(privado/|datos-reales/)|\.(xlsx|pem|key|p12|pfx)$' || true)
          if [ -n "$encontrados" ]; then
            echo "FALLÓ: archivos que no deben versionarse:"
            echo "$encontrados"
            exit 1
          fi
          echo "OK: no hay archivos excluidos versionados."

      - name: Comprobar que los datasets siguen siendo sintéticos
        run: |
          if [ -d datasets ]; then
            grep -rl "sintétic" datasets --include='*.md' >/dev/null || {
              echo "FALLÓ: datasets/ debe declarar explícitamente que sus datos son sintéticos."
              exit 1
            }
          fi
          echo "OK: los datos declaran su origen sintético."
